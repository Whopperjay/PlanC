services:
  f1-data-updater:
    build: .
    container_name: f1-data-updater
    restart: unless-stopped
    env_file:
      - groq.env
      - cloudkit.env
    volumes:
      # Mount the host's SSH keys so the container can authenticate with GitHub
      - /root/.ssh:/root/.ssh:ro
      # Cle server-to-server CloudKit. Elle vit hors du dossier du projet :
      # celui-ci est publie sur un depot GitHub PUBLIC.
      - /root/.cloudkit:/root/.cloudkit:ro
      # Sync timezone
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PYTHONUNBUFFERED=1
      - GIT_SSH_COMMAND=ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
      - OLLAMA_URL=http://host.docker.internal:11434   # fallback only (LLM_PROVIDER=ollama)
      - LLM_PROVIDER=groq
      - GROQ_MODEL=openai/gpt-oss-120b
      - GROQ_PRED_MODEL=openai/gpt-oss-120b
      - DATA_DIR=data
      - CLOUDKIT_CONTAINER=iCloud.Planc
      - CLOUDKIT_ENV=production
      - CLOUDKIT_KEY_PATH=/root/.cloudkit/eckey.pem
    extra_hosts:
      - host.docker.internal:host-gateway
